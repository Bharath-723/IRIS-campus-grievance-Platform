<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRIS — Club Grievance Intelligence Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Dark Mode Defaults */
    --bg: #0c0e12;
    --surface: #14171f;
    --surface2: #1c212c;
    --surface3: #252b3a;
    --border: #293040;
    --border-hover: #3b4559;
    --text: #f3f5f9;
    --text-muted: #8b95a8;
    --accent: #f59e0b;
    --accent-bg: rgba(245, 158, 11, 0.15);
    --accent2: #38bdf8;
    --critical: #ef4444;
    --critical-bg: rgba(239, 68, 68, 0.15);
    --high: #f97316;
    --high-bg: rgba(249, 115, 22, 0.15);
    --medium: #eab308;
    --medium-bg: rgba(234, 179, 8, 0.15);
    --low: #10b981;
    --low-bg: rgba(16, 185, 129, 0.15);
    --ai: #a855f7;
    --ai-bg: rgba(168, 85, 247, 0.12);
    --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    --radius: 12px;
  }

  [data-theme="light"] {
    /* Light Mode */
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface2: #f8fafc;
    --surface3: #eef2f7;
    --border: #dbe2ea;
    --border-hover: #cbd5e1;
    --text: #0f172a;
    --text-muted: #64748b;
    --accent: #d97706;
    --accent-bg: rgba(217, 119, 6, 0.12);
    --accent2: #0284c7;
    --critical: #dc2626;
    --critical-bg: rgba(220, 38, 38, 0.12);
    --high: #ea580c;
    --high-bg: rgba(234, 88, 12, 0.12);
    --medium: #ca8a04;
    --medium-bg: rgba(202, 138, 4, 0.12);
    --low: #059669;
    --low-bg: rgba(5, 150, 105, 0.12);
    --ai: #7e22ce;
    --ai-bg: rgba(126, 34, 206, 0.1);
    --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    transition: background 0.25s ease, color 0.25s ease;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 24px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo span {
    color: var(--text-muted);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .header-stats {
    display: flex;
    gap: 16px;
    background: var(--surface2);
    padding: 6px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .hstat {
    text-align: center;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.15s;
  }
  .hstat:hover { background: var(--surface3); }
  .hstat.active { outline: 1px solid var(--accent); }
  .hstat-val { font-size: 17px; font-weight: 700; color: var(--accent); }
  .hstat-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

  /* Theme Toggle Button */
  .theme-toggle-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .theme-toggle-btn:hover {
    border-color: var(--accent);
    background: var(--surface3);
  }

  /* Toolbar */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-wrap: wrap;
  }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .filter-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 600;
    margin-right: 4px;
  }
  .filter-btn {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
  }
  .filter-btn:hover {
    border-color: var(--accent);
    color: var(--text);
  }
  .filter-btn.active {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
    font-weight: 600;
  }
  .filter-divider {
    width: 1px;
    height: 20px;
    background: var(--border);
    margin: 0 4px;
  }

  .search-wrap {
    margin-left: auto;
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-wrap input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 7px 32px 7px 32px;
    width: 240px;
    outline: none;
    transition: all 0.15s;
  }
  .search-wrap input:focus {
    border-color: var(--accent);
    width: 280px;
    background: var(--surface);
  }
  .search-icon {
    position: absolute;
    left: 12px;
    color: var(--text-muted);
    font-size: 13px;
    pointer-events: none;
  }
  .search-clear {
    position: absolute;
    right: 10px;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 14px;
    display: none;
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 20px;
    padding: 24px 32px;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--card-shadow);
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    animation: fadeUp 0.3s ease both;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--border-hover);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Media Thumbnail */
  .card-media {
    width: 100%;
    height: 180px;
    background: var(--surface2);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s;
    cursor: pointer;
  }
  .card-media:hover img { transform: scale(1.03); }
  .no-media {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--text-muted);
    font-size: 12px;
  }
  .no-media-icon {
    font-size: 22px;
    opacity: 0.7;
  }
  .media-overlay-badge {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(0,0,0,0.7);
    color: #ffffff;
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 6px;
    backdrop-filter: blur(4px);
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .media-overlay-badge:hover { background: rgba(0,0,0,0.9); }

  .ai-category-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    background: var(--ai);
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  /* Card Body */
  .card-body {
    padding: 18px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .severity-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .sev-critical { background: var(--critical-bg); color: var(--critical); border: 1px solid var(--critical); }
  .sev-high     { background: var(--high-bg); color: var(--high); border: 1px solid var(--high); }
  .sev-medium   { background: var(--medium-bg); color: var(--medium); border: 1px solid var(--medium); }
  .sev-low      { background: var(--low-bg); color: var(--low); border: 1px solid var(--low); }

  .status-dot {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: capitalize;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-open        { background: var(--critical); box-shadow: 0 0 6px var(--critical); }
  .dot-in_progress { background: var(--medium); box-shadow: 0 0 6px var(--medium); }
  .dot-resolved    { background: var(--low); box-shadow: 0 0 6px var(--low); }

  .card-place {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent2);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .card-issue {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.45;
    margin-bottom: 12px;
    color: var(--text);
    word-break: break-word;
  }

  /* AI Solution Callout */
  .ai-solution-box {
    background: var(--ai-bg);
    border: 1px solid var(--ai);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .ai-solution-label {
    font-size: 10px;
    color: var(--ai);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .ai-solution-text {
    font-size: 12px;
    color: var(--text);
    line-height: 1.5;
  }
  .ai-reason {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 4px;
    font-style: italic;
  }

  .card-meta {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--text-muted);
  }
  .meta-item { display: flex; align-items: center; gap: 4px; }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    margin-top: auto;
  }
  .reporter { display: flex; align-items: center; gap: 8px; }
  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
  }
  .reporter-name { font-size: 12px; font-weight: 600; color: var(--text); }
  .reporter-email { font-size: 11px; color: var(--text-muted); }
  .freq-badge {
    font-size: 11px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    color: var(--accent);
    font-weight: 600;
  }

  /* Card Action Buttons */
  .card-actions {
    display: flex;
    gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    background: var(--surface2);
  }
  .btn {
    flex: 1;
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 600;
    text-align: center;
  }
  .btn:hover {
    background: var(--surface3);
    border-color: var(--border-hover);
  }
  .btn-primary {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }
  .btn-primary:hover {
    opacity: 0.9;
    background: var(--accent);
    color: #ffffff;
  }
  .btn-resolve {
    background: var(--low-bg);
    color: var(--low);
    border-color: var(--low);
  }
  .btn-resolve:hover {
    background: var(--low);
    color: #ffffff;
  }

  /* Modals */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 998;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    width: 440px;
    max-width: 90vw;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .modal h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    margin-bottom: 6px;
    color: var(--accent);
  }
  .modal p.subtitle {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }
  .modal label {
    display: block;
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 6px;
    margin-top: 14px;
    font-weight: 600;
  }
  .modal input, .modal select, .modal textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 9px 12px;
    outline: none;
    transition: border 0.15s;
  }
  .modal input:focus, .modal select:focus, .modal textarea:focus {
    border-color: var(--accent);
  }
  .modal textarea { height: 80px; resize: vertical; }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  /* Solutions Slide-out Drawer */
  .solutions-panel {
    display: none;
    position: fixed;
    right: 0;
    top: 0;
    bottom: 0;
    width: 440px;
    max-width: 95vw;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 997;
    overflow-y: auto;
    flex-direction: column;
    box-shadow: -4px 0 24px rgba(0, 0, 0, 0.4);
    animation: slideIn 0.25s ease both;
  }
  .solutions-panel.open { display: flex; }
  @keyframes slideIn {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }
  .panel-header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 10;
  }
  .panel-title { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--accent); }
  .panel-close {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .panel-close:hover { background: var(--surface3); }
  .panel-body { padding: 20px; flex: 1; }
  .solution-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .solution-card.ai-best {
    border-color: var(--ai);
    background: var(--ai-bg);
  }
  .solution-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .solution-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .solution-time { font-size: 11px; color: var(--text-muted); }
  .solution-text { font-size: 13px; color: var(--text); line-height: 1.5; margin-bottom: 10px; }
  .solution-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tag { font-size: 10px; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
  .tag-reward { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent); }
  .tag-unique { background: var(--low-bg); color: var(--low); border: 1px solid var(--low); }
  .tag-ai { background: var(--ai-bg); color: var(--ai); border: 1px solid var(--ai); }
  .ai-score-bar { height: 5px; border-radius: 3px; background: var(--border); margin-top: 8px; overflow: hidden; }
  .ai-score-fill { height: 100%; background: var(--ai); border-radius: 3px; }
  .mark-unique-btn {
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.15s;
    font-weight: 500;
  }
  .mark-unique-btn:hover { border-color: var(--low); color: var(--low); }

  .resolution-proof {
    background: var(--low-bg);
    border: 1px solid var(--low);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .resolution-proof-label {
    font-size: 11px;
    color: var(--low);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    padding: 24px;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 80vh; border-radius: 8px; border: 1px solid var(--border); }
  .lightbox-close {
    position: absolute;
    top: 20px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 20px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lightbox-caption { color: #ffffff; font-size: 14px; font-weight: 500; }

  /* Empty state */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state p { font-size: 15px; margin-bottom: 12px; }

  /* Toast notification */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 10px 24px;
    font-size: 13px;
    color: var(--text);
    z-index: 9999;
    opacity: 0;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-6px);
  }

  .loading {
    text-align: center;
    padding: 60px;
    color: var(--text-muted);
    font-size: 14px;
    grid-column: 1 / -1;
  }
  .spinner {
    width: 34px;
    height: 34px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">IRIS <span>Club Dashboard</span></div>
  </div>
  <div class="header-right">
    <div class="header-stats">
      <div class="hstat active" id="stat-card-all" onclick="filterStatus('all')">
        <div class="hstat-val" id="stat-total">—</div>
        <div class="hstat-lbl">Total</div>
      </div>
      <div class="hstat" id="stat-card-open" onclick="filterStatus('open')">
        <div class="hstat-val" id="stat-open" style="color:var(--critical)">—</div>
        <div class="hstat-lbl">Open</div>
      </div>
      <div class="hstat" id="stat-card-in_progress" onclick="filterStatus('in_progress')">
        <div class="hstat-val" id="stat-progress" style="color:var(--medium)">—</div>
        <div class="hstat-lbl">In Progress</div>
      </div>
      <div class="hstat" id="stat-card-resolved" onclick="filterStatus('resolved')">
        <div class="hstat-val" id="stat-resolved" style="color:var(--low)">—</div>
        <div class="hstat-lbl">Resolved</div>
      </div>
    </div>
    <button class="theme-toggle-btn" id="theme-toggle-btn" onclick="toggleTheme()">
      ☀ Light Mode
    </button>
  </div>
</header>

<div class="toolbar">
  <div class="filter-group">
    <span class="filter-label">Severity</span>
    <button class="filter-btn active sev-btn" onclick="filterSeverity('all', this)">All</button>
    <button class="filter-btn sev-btn" onclick="filterSeverity('critical', this)" style="color:var(--critical)">Critical</button>
    <button class="filter-btn sev-btn" onclick="filterSeverity('high', this)" style="color:var(--high)">High</button>
    <button class="filter-btn sev-btn" onclick="filterSeverity('medium', this)" style="color:var(--medium)">Medium</button>
    <button class="filter-btn sev-btn" onclick="filterSeverity('low', this)" style="color:var(--low)">Low</button>
  </div>

  <div class="filter-divider"></div>

  <div class="filter-group">
    <span class="filter-label">Category</span>
    <button class="filter-btn active cat-btn" onclick="filterCategory('all', this)">All</button>
    <button class="filter-btn cat-btn" onclick="filterCategory('infrastructure', this)">🏗 Infra</button>
    <button class="filter-btn cat-btn" onclick="filterCategory('hygiene', this)">🧹 Hygiene</button>
    <button class="filter-btn cat-btn" onclick="filterCategory('technology', this)">💻 Tech</button>
    <button class="filter-btn cat-btn" onclick="filterCategory('safety', this)">⚠ Safety</button>
    <button class="filter-btn cat-btn" onclick="filterCategory('admin', this)">📋 Admin</button>
  </div>

  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search-input" placeholder="Search issues, location, student..." oninput="handleSearch(this.value)">
    <span class="search-clear" id="search-clear" onclick="clearSearch()">✕</span>
  </div>
</div>

<div class="grid" id="issue-grid">
  <div class="loading"><div class="spinner"></div>Loading grievances from Supabase...</div>
</div>

<!-- Lightbox Modal -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close">✕</button>
  <img id="lightbox-img" src="" alt="Evidence Photo">
  <div class="lightbox-caption" id="lightbox-caption"></div>
</div>

<!-- Status Modal -->
<div class="modal-bg" id="modal-bg" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>Update Ticket Status</h3>
    <p class="subtitle">Change the operational state of this student report</p>
    <label>New Status</label>
    <select id="modal-status">
      <option value="open">Open</option>
      <option value="in_progress">In Progress</option>
      <option value="resolved">Resolved</option>
    </select>
    <label>Action / Administrative Note</label>
    <textarea id="modal-note" placeholder="Note on assignment, contractor dispatched, or status..."></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="save-status-btn" onclick="saveStatus()">Save Update</button>
    </div>
  </div>
</div>

<!-- Resolution Proof Modal -->
<div class="modal-bg" id="resolve-modal-bg" onclick="closeResolveModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 style="color:var(--low)">Mark Issue as Resolved</h3>
    <p class="subtitle">Submit proof of work to verify resolution</p>
    <label>Resolved By</label>
    <input type="text" id="resolve-by" placeholder="Your name / club member name">
    <label>Resolution Summary</label>
    <textarea id="resolve-note" placeholder="Explain how the issue was fixed..."></textarea>
    <label>Proof Media Link (Google Drive / Photo URL)</label>
    <input type="text" id="resolve-media" placeholder="https://drive.google.com/file/d/...">
    <div class="modal-actions">
      <button class="btn" onclick="closeResolveModal()">Cancel</button>
      <button class="btn btn-resolve" id="submit-resolve-btn" onclick="submitResolution()">Confirm Resolved</button>
    </div>
  </div>
</div>

<!-- Solutions Drawer -->
<div class="solutions-panel" id="solutions-panel">
  <div class="panel-header">
    <div class="panel-title">Student Solutions</div>
    <button class="panel-close" onclick="closeSolutions()">✕</button>
  </div>
  <div class="panel-body" id="panel-body">
    <div class="loading"><div class="spinner"></div>Loading solutions...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = (window.location.protocol === 'file:') ? 'http://localhost:5000/api' : '/api';
let allIssues      = [];
let filtered       = [];
let activeIssueId  = null;
let activeSeverity = 'all';
let activeCategory = 'all';
let activeStatus   = 'all';
let activeSearch   = '';

// ── Theme Management (Light / Dark) ──
function initTheme() {
  const saved = localStorage.getItem('iris-theme') || 'dark';
  setTheme(saved);
}

function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('iris-theme', theme);
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) {
    btn.innerHTML = (theme === 'dark') ? '☀ Light Mode' : '🌙 Dark Mode';
  }
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = (current === 'dark') ? 'light' : 'dark';
  setTheme(next);
}

// ── Toast Notification ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ── Load Stats ──
async function loadStats() {
  try {
    const res = await fetch(`${API}/stats?t=${Date.now()}`);
    const data = await res.json();
    if (data.success) {
      const s = data.stats;
      document.getElementById('stat-total').textContent    = s.total ?? 0;
      document.getElementById('stat-open').textContent     = s.open ?? 0;
      document.getElementById('stat-progress').textContent = s.in_progress ?? 0;
      document.getElementById('stat-resolved').textContent = s.resolved ?? 0;
    }
  } catch (e) {
    console.error('Stats error:', e);
  }
}

// ── Load Issues ──
async function loadIssues() {
  try {
    const res = await fetch(`${API}/issues?t=${Date.now()}`);
    const data = await res.json();
    if (data.success) {
      allIssues = data.issues || [];
      applyFilters();
      loadStats();
    } else {
      showError(data.error || 'Failed to retrieve issues from Supabase.');
    }
  } catch (e) {
    showError('Cannot connect to API server. Ensure api.py is running on http://localhost:5000.');
  }
}

function showError(msg) {
  document.getElementById('issue-grid').innerHTML = `
    <div class="empty-state">
      <div style="font-size:32px;margin-bottom:12px;">⚠</div>
      <p style="color:var(--critical);font-weight:600;margin-bottom:6px;">Connection Notice</p>
      <p style="font-size:12px;max-width:320px;margin:0 auto 16px;">${msg}</p>
      <button class="btn" style="max-width:140px;margin:0 auto;" onclick="loadIssues()">Retry Connection</button>
    </div>`;
}

function getInitials(name) {
  if (!name) return '?';
  return name.trim().split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
}

function categoryIcon(cat) {
  const c = (cat || '').toLowerCase();
  if (c.includes('infra')) return '🏗';
  if (c.includes('hygiene') || c.includes('clean')) return '🧹';
  if (c.includes('tech')) return '💻';
  if (c.includes('safe')) return '⚠';
  if (c.includes('admin')) return '📋';
  return '📌';
}

function getImageUrl(url) {
  if (!url) return '';
  if (url.includes('drive.google.com')) {
    const match = url.match(/id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (match) return `${API}/image/${match[1]}`;
  }
  return url;
}

// ── Render Cards ──
function renderCards() {
  const grid = document.getElementById('issue-grid');
  if (!filtered.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <div style="font-size:36px;margin-bottom:12px;opacity:0.6;">🔍</div>
        <p>No complaints match your current filters.</p>
        <button class="btn" style="max-width:160px;margin:12px auto 0;" onclick="resetFilters()">Reset All Filters</button>
      </div>`;
    return;
  }

  grid.innerHTML = '';
  filtered.forEach((issue, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (Math.min(idx, 15) * 0.04) + 's';

    const sevKey = (issue.severity_level || 'low').toLowerCase();
    const statusKey = (issue.status || 'open').toLowerCase().replace(' ', '_');
    const thumbUrl = getImageUrl(issue.media_url);

    // Media Thumbnail & Direct Image Display
    const mediaHTML = issue.media_url
      ? `<div class="card-media">
           <img src="${thumbUrl}" alt="Evidence Photo" loading="lazy"
                onclick="openLightbox('${thumbUrl}', '${escapeHtml(issue.place || '')}')"
                onerror="this.onerror=null; this.src='${API}/image/placeholder';">
           ${issue.ai_category ? `<div class="ai-category-badge">${categoryIcon(issue.ai_category)} ${issue.ai_category}</div>` : ''}
         </div>`
      : `<div class="card-media">
           <div class="no-media">
             <div class="no-media-icon">◻</div>
             <span>No media attached</span>
             ${issue.ai_category ? `<span style="font-size:11px;color:var(--ai);font-weight:600;margin-top:4px;">${categoryIcon(issue.ai_category)} ${issue.ai_category}</span>` : ''}
           </div>
         </div>`;

    // AI Recommended Solution Box
    const aiBox = issue.ai_best_solution
      ? `<div class="ai-solution-box">
           <div class="ai-solution-label">🤖 AI Recommended Solution</div>
           <div class="ai-solution-text">${escapeHtml(issue.ai_best_solution)}</div>
           ${issue.ai_reason ? `<div class="ai-reason">${escapeHtml(issue.ai_reason)}</div>` : ''}
         </div>`
      : '';

    card.innerHTML = `
      ${mediaHTML}
      <div class="card-body">
        <div class="card-top">
          <span class="severity-badge sev-${sevKey}">${issue.severity_level || 'Normal'}</span>
          <div class="status-dot">
            <div class="dot dot-${statusKey}"></div>
            ${statusKey.replace('_', ' ')}
          </div>
        </div>
        <div class="card-place">📍 ${escapeHtml(issue.place || 'Campus')}</div>
        <div class="card-issue">${escapeHtml(issue.representative_issue || 'No description provided')}</div>
        ${aiBox}
        <div class="card-meta">
          <div class="meta-item">⏱ ${escapeHtml(issue.issue_duration || 'Present')}</div>
          <div class="meta-item">📅 ${issue.days_open || 0} days open</div>
          <div class="meta-item">👥 ${issue.frequency || 1} report(s)</div>
        </div>
        <div class="card-footer">
          <div class="reporter">
            <div class="avatar">${getInitials(issue.first_raiser_name)}</div>
            <div>
              <div class="reporter-name">${escapeHtml(issue.first_raiser_name || 'Anonymous')}</div>
              <div class="reporter-email">${escapeHtml(issue.first_raiser_email || '')}</div>
            </div>
          </div>
          <div class="freq-badge">${issue.frequency || 1}× reported</div>
        </div>
      </div>
      <div class="card-actions">
        <button class="btn" onclick="viewSolutions(${issue.id})">Solutions (${issue.total_solutions || 0})</button>
        <button class="btn btn-resolve" onclick="openResolveModal(${issue.id})">✓ Resolve</button>
        <button class="btn btn-primary" onclick="openModal(${issue.id}, '${statusKey}')">Status</button>
      </div>`;
    grid.appendChild(card);
  });
}

// ── Multi-criteria Filtering & Search ──
function applyFilters() {
  const s = activeSearch.trim().toLowerCase();
  filtered = allIssues.filter(i => {
    // Severity Filter
    const sev = (i.severity_level || '').toLowerCase();
    const matchSev = (activeSeverity === 'all') || (sev === activeSeverity);

    // Category Filter
    const cat = (i.ai_category || '').toLowerCase();
    const matchCat = (activeCategory === 'all') || cat.includes(activeCategory);

    // Status Filter
    const stat = (i.status || 'open').toLowerCase().replace(' ', '_');
    const matchStat = (activeStatus === 'all') || (stat === activeStatus);

    // Search Filter
    const matchSearch = !s || (
      (i.representative_issue || '').toLowerCase().includes(s) ||
      (i.place || '').toLowerCase().includes(s) ||
      (i.first_raiser_name || '').toLowerCase().includes(s) ||
      (i.first_raiser_email || '').toLowerCase().includes(s) ||
      (i.ai_category || '').toLowerCase().includes(s) ||
      (i.ai_best_solution || '').toLowerCase().includes(s)
    );

    return matchSev && matchCat && matchStat && matchSearch;
  });
  renderCards();
}

function filterSeverity(sev, btn) {
  activeSeverity = sev.toLowerCase();
  document.querySelectorAll('.sev-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function filterCategory(cat, btn) {
  activeCategory = cat.toLowerCase();
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function filterStatus(stat) {
  activeStatus = stat.toLowerCase();
  document.querySelectorAll('.hstat').forEach(b => b.classList.remove('active'));
  const target = document.getElementById(`stat-card-${activeStatus}`);
  if (target) target.classList.add('active');
  applyFilters();
}

function handleSearch(val) {
  activeSearch = val;
  const clearBtn = document.getElementById('search-clear');
  if (clearBtn) clearBtn.style.display = val ? 'block' : 'none';
  applyFilters();
}

function clearSearch() {
  const input = document.getElementById('search-input');
  if (input) input.value = '';
  handleSearch('');
}

function resetFilters() {
  activeSeverity = 'all';
  activeCategory = 'all';
  activeStatus = 'all';
  activeSearch = '';
  document.querySelectorAll('.sev-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.hstat').forEach(b => b.classList.remove('active'));
  document.querySelector('.sev-btn')?.classList.add('active');
  document.querySelector('.cat-btn')?.classList.add('active');
  document.getElementById('stat-card-all')?.classList.add('active');
  clearSearch();
  applyFilters();
}

// ── Lightbox ──
function openLightbox(url, place) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox-caption').textContent = place ? `Evidence Photo — ${place}` : 'Evidence Photo';
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

// ── Status Modal ──
function openModal(id, currentStatus) {
  activeIssueId = id;
  const select = document.getElementById('modal-status');
  select.value = (currentStatus || 'open').toLowerCase().replace(' ', '_');
  document.getElementById('modal-note').value = '';
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-bg').classList.remove('open');
}

async function saveStatus() {
  if (!activeIssueId) return;
  const status = document.getElementById('modal-status').value;
  const note   = document.getElementById('modal-note').value.trim();
  const btn    = document.getElementById('save-status-btn');

  btn.textContent = 'Saving...';
  btn.disabled = true;

  try {
    const res = await fetch(`${API}/issues/${activeIssueId}/status`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status, note, action_by: 'Club Admin' })
    });
    const data = await res.json();
    if (data.success) {
      closeModal();
      showToast('Status successfully updated in Supabase!');
      loadIssues();
    } else {
      showToast('Error: ' + (data.error || 'Update failed'));
    }
  } catch (e) {
    showToast('Failed to reach API server');
  } finally {
    btn.textContent = 'Save Update';
    btn.disabled = false;
  }
}

// ── Resolution Proof Modal ──
function openResolveModal(id) {
  activeIssueId = id;
  document.getElementById('resolve-by').value = '';
  document.getElementById('resolve-note').value = '';
  document.getElementById('resolve-media').value = '';
  document.getElementById('resolve-modal-bg').classList.add('open');
}
function closeResolveModal() {
  document.getElementById('resolve-modal-bg').classList.remove('open');
}

async function submitResolution() {
  if (!activeIssueId) return;
  const resolved_by     = document.getElementById('resolve-by').value.trim();
  const resolution_note = document.getElementById('resolve-note').value.trim();
  const proof_media_url = document.getElementById('resolve-media').value.trim();
  const btn = document.getElementById('submit-resolve-btn');

  if (!resolved_by || !resolution_note) {
    showToast('Please enter your name and resolution details.');
    return;
  }

  btn.textContent = 'Submitting...';
  btn.disabled = true;

  try {
    const res = await fetch(`${API}/issues/${activeIssueId}/resolve`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resolved_by, resolution_note, proof_media_url })
    });
    const data = await res.json();
    if (data.success) {
      closeResolveModal();
      showToast('Resolution proof saved! Ticket marked as resolved.');
      loadIssues();
    } else {
      showToast('Error: ' + (data.error || 'Submission failed'));
    }
  } catch (e) {
    showToast('Failed to reach API server');
  } finally {
    btn.textContent = 'Confirm Resolved';
    btn.disabled = false;
  }
}

// ── Solutions Panel (Drawer) ──
async function viewSolutions(issueId) {
  activeIssueId = issueId;
  const panel = document.getElementById('solutions-panel');
  const body = document.getElementById('panel-body');
  panel.classList.add('open');
  body.innerHTML = '<div class="loading"><div class="spinner"></div>Fetching solutions...</div>';

  try {
    const [solRes, resRes] = await Promise.all([
      fetch(`${API}/issues/${issueId}/solutions`),
      fetch(`${API}/issues/${issueId}/resolution`)
    ]);
    const solData = await solRes.json();
    const resData = await resRes.json();
    let html = '';

    // Resolution Proof Header if available
    if (resData.success && resData.records && resData.records.length > 0) {
      const r = resData.records[0];
      html += `
        <div class="resolution-proof">
          <div class="resolution-proof-label">✓ Resolution Verification</div>
          <div style="font-size:13px;color:var(--text);margin-bottom:4px;"><b>${escapeHtml(r.resolved_by)}</b>: ${escapeHtml(r.resolution_note)}</div>
          <div style="font-size:11px;color:var(--text-muted);">${new Date(r.resolved_at).toLocaleString()}</div>
          ${r.proof_media_url ? `<a href="${r.proof_media_url}" target="_blank" style="display:inline-block;margin-top:8px;font-size:11px;color:var(--low);text-decoration:underline;">View Proof Photo ↗</a>` : ''}
        </div>`;
    }

    if (!solData.solutions || !solData.solutions.length) {
      html += '<div class="empty-state"><p>No student solutions submitted for this issue yet.</p></div>';
    } else {
      html += solData.solutions.map(s => {
        const aiScore = s.ai_score ? Number(s.ai_score) : null;
        return `
          <div class="solution-card ${s.ai_selected ? 'ai-best' : ''}">
            <div class="solution-meta">
              <div class="solution-name">${escapeHtml(s.submitter_name || 'Anonymous Student')}</div>
              <div class="solution-time">${s.submitted_at ? new Date(s.submitted_at).toLocaleDateString() : ''}</div>
            </div>
            <div class="solution-text">${escapeHtml(s.solution_text || '')}</div>
            <div class="solution-tags">
              ${s.ai_selected  ? '<span class="tag tag-ai">🤖 AI Top Pick</span>' : ''}
              ${s.is_unique    ? '<span class="tag tag-unique">⭐ Unique Idea</span>' : ''}
              ${s.wants_reward ? '<span class="tag tag-reward">🏆 Reward Contestant</span>' : ''}
            </div>
            ${aiScore ? `
              <div class="ai-score-bar">
                <div class="ai-score-fill" style="width:${Math.min(aiScore * 10, 100)}%"></div>
              </div>
              <div style="font-size:10px;color:var(--ai);font-weight:600;margin-top:4px;">AI Feasibility Score: ${aiScore}/10</div>
            ` : ''}
            ${!s.is_unique ? `
              <button class="mark-unique-btn" onclick="markUnique(${s.id})">⭐ Flag as Standout Solution</button>
            ` : ''}
          </div>`;
      }).join('');
    }

    body.innerHTML = html;
  } catch (e) {
    body.innerHTML = '<div class="empty-state"><p style="color:var(--critical);">Failed to load solutions.</p></div>';
  }
}

function closeSolutions() {
  document.getElementById('solutions-panel').classList.remove('open');
}

async function markUnique(solutionId) {
  try {
    const res = await fetch(`${API}/solutions/${solutionId}/mark-unique`, { method: 'POST' });
    const data = await res.json();
    if (data.success) {
      showToast('Marked as standout unique solution!');
      viewSolutions(activeIssueId);
    } else {
      showToast('Error: ' + data.error);
    }
  } catch (e) {
    showToast('Failed to reach API server');
  }
}

// ── Keyboard Shortcuts (Esc to close modals) ──
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeModal();
    closeResolveModal();
    closeSolutions();
    closeLightbox();
  }
});

// Helper for HTML escaping
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// ── Auto-Refresh Every 30s ──
setInterval(() => { loadIssues(); }, 30000);

// ── Initialize App ──
initTheme();
loadIssues();
</script>
</body>
</html>
